{% extends 'base.html' %}
{% block content %}



<ul class="list-group">
  {% for lesson in lessons %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <a href="{% url 'lessons_app:lesson-detail' lesson.pk %}"
         class="text-decoration-none text-body me-3 flex-grow-1">
        <div class="fw-bold">{{ lesson.name }}</div>
      </a>

      <a href="{% url 'lessons_app:lesson-detail' lesson.pk %}"
         class="btn btn-primary btn-sm flex-shrink-0 px-4">
        Деталі
      </a>
    </li>
  {% endfor %}
</ul>


{% endblock %}
